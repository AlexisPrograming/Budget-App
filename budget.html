<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090a0d">
<title>Budget</title>
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'DM Mono','SF Mono',monospace;
  --bg:#090a0d;
  --bg2:#0f1117;
  --surface:rgba(255,255,255,0.045);
  --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);
  --text:#f2f2fa;
  --t2:rgba(242,242,250,0.55);
  --t3:rgba(242,242,250,0.28);
  --green:#1dc99a;
  --green-dim:rgba(29,201,154,0.12);
  --green-glow:rgba(29,201,154,0.30);
  --red:#f07070;
  --red-dim:rgba(240,112,112,0.12);
  --amber:#f0b840;
  --amber-dim:rgba(240,184,64,0.10);
  --blue:#60a5fa;
  --purple:#a78bfa;
  --blur:blur(24px) saturate(160%);
  --r:18px;--r-sm:12px;--r-xs:8px;
  --nav-h:72px;
  --sidebar:240px;
}

html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;overflow:hidden}
/* Prevent text selection on long-press (iOS Safari) */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
/* Prevent double-tap zoom on buttons and interactive elements */
button,a,[data-tab],.nk,.cat-btn,.nav-item,.imp-chk,label,[onclick]{touch-action:manipulation}

/* ── LAYOUT ── */
#shell{
  display:flex;
  height:100vh;height:100dvh;
  overflow:hidden;
}

/* MOBILE: single column — fills the full phone screen */
#sidebar{display:none}
#main{
  flex:1;display:flex;flex-direction:column;
  width:100%;
  height:100vh;height:100dvh;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(ellipse at 15% 5%,  rgba(29,201,154,0.13) 0%,transparent 40%),
    radial-gradient(ellipse at 85% 92%, rgba(96,165,250,0.09) 0%,transparent 40%),
    radial-gradient(ellipse at 55% 50%, rgba(167,139,250,0.05) 0%,transparent 38%),
    var(--bg);
}
#content{
  flex:1;
  min-height:0; /* essential for flex child to shrink and scroll */
  padding:0.65rem 0.875rem calc(12px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

/* DESKTOP: sidebar + main */
@media(min-width:768px){
  #shell{background:var(--bg)}
  #sidebar{
    display:flex;flex-direction:column;
    width:var(--sidebar);min-height:100vh;
    background:rgba(255,255,255,0.025);
    border-right:1px solid var(--border);
    padding:1.5rem 0;
    position:sticky;top:0;align-self:flex-start;height:100vh;
    overflow:hidden;
  }
  #main{
    max-width:none;margin:0;
    flex:1;
    background:
      radial-gradient(ellipse at 15% 5%,  rgba(29,201,154,0.10) 0%,transparent 40%),
      radial-gradient(ellipse at 85% 92%, rgba(96,165,250,0.07) 0%,transparent 40%),
      var(--bg);
  }
  #content{
    max-width:780px;margin:0 auto;
    padding:2rem 2.5rem 3rem;
    font-size:16px;
  }
  #nav{display:none!important}
}
@media(min-width:1200px){
  #content{max-width:960px;font-size:17px}
  :root{--r:20px;--r-sm:14px}
}
@media(min-width:1600px){
  #content{max-width:1100px;font-size:18px}
  :root{--sidebar:280px}
}

/* ── SIDEBAR NAV ── */
.sb-logo{
  padding:0 1.25rem 1.5rem;
  font-size:16px;font-weight:700;letter-spacing:-0.01em;
  display:flex;align-items:center;gap:9px;color:var(--text)
}
.sb-logo-icon{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#1dc99a,#14a07c);
  display:flex;align-items:center;justify-content:center;
}
.sb-logo-icon i{font-size:18px;color:#001710}
.sb-nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 1.25rem;margin:1px 0.5rem;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--t2);
  cursor:pointer;border:none;background:transparent;
  font-family:var(--font);width:calc(100% - 1rem);
  text-align:left;
  transition:background 0.15s,color 0.15s;
}
.sb-nav-item i{font-size:19px;transition:color 0.15s}
.sb-nav-item:hover{background:var(--surface2);color:var(--text)}
.sb-nav-item.active{background:var(--green-dim);color:var(--green)}
.sb-nav-item.active i{color:var(--green)}
.sb-divider{height:1px;background:var(--border);margin:0.75rem 1rem}
.sb-section{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:0.1em;text-transform:uppercase;padding:0 1.5rem;margin:0.5rem 0 0.25rem}

/* ── MOBILE NAV ── */
#nav{
  display:flex;align-items:stretch;
  background:rgba(9,10,13,0.96);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
  flex-shrink:0;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:transparent;border:none;padding:0 0 2px;
  color:var(--t3);font-size:10px;font-weight:600;letter-spacing:0.04em;
  transition:color 0.22s;cursor:pointer;font-family:var(--font);
  position:relative;
}
/* Active indicator: small pill at top edge */
.nav-item::after{
  content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%) scaleX(0);
  width:20px;height:3px;border-radius:0 0 4px 4px;
  background:var(--green);
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.nav-item.active::after{transform:translateX(-50%) scaleX(1)}
.nav-item i{
  font-size:23px;
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),color 0.22s;
  display:block;
}
.nav-item.active{color:var(--green)}
.nav-item.active i{transform:scale(1.18) translateY(-1px);color:var(--green)}
.nav-item:active{opacity:0.55}
.nav-fab-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:transparent;border:none;cursor:pointer;padding:0 0 2px;font-family:var(--font);
}
.fab{
  width:44px;height:44px;border-radius:14px;
  background:var(--green-dim);
  border:1.5px solid rgba(29,201,154,0.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1),background 0.15s,border-color 0.15s;
}
.nav-fab-wrap:active .fab{transform:scale(0.88)!important;background:rgba(29,201,154,0.2)}
.fab i{font-size:22px;color:var(--green);line-height:1}
.fab-lbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:0.04em}
.nav-fab-wrap.active .fab-lbl{color:var(--green)}
.nav-fab-wrap.active .fab{
  background:rgba(29,201,154,0.18);
  border-color:rgba(29,201,154,0.55);
}

/* ── ANIMATIONS ── */
@keyframes tabIn{
  from{opacity:0;transform:translateY(14px) scale(0.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes popIn{from{opacity:0;transform:scale(0.72)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.anim{animation:tabIn 0.3s cubic-bezier(0.22,1,0.36,1) both}
button{
  font-family:var(--font);cursor:pointer;outline:none;
  transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1),opacity 0.12s,background 0.15s,box-shadow 0.2s;
}
button:active{transform:scale(0.91)!important;opacity:0.8}

/* ── CARDS ── */
.card{
  background:var(--surface);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--r);
  padding:0.875rem;margin-bottom:8px;
}
.card-sm{
  background:var(--surface);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--r-sm);
  padding:0.875rem 1rem;margin-bottom:8px;
}

/* ── BUTTONS ── */
.btn{
  background:var(--surface2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border2);color:var(--t2);
  padding:7px 16px;font-size:12px;font-weight:500;
  border-radius:30px;letter-spacing:0.02em;
}
.btn:hover{color:var(--text);background:rgba(255,255,255,0.12)}
.btn-green{
  background:linear-gradient(135deg,#1dc99a,#14a07c);border:none;
  color:#001a10;padding:14px;font-size:14px;font-weight:600;
  width:100%;border-radius:var(--r-sm);letter-spacing:0.015em;
  box-shadow:0 4px 18px var(--green-glow);
}
.btn-green:hover{background:linear-gradient(135deg,#22dcaa,#1ab589)}
.btn-green:active{box-shadow:none!important}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--t2);padding:7px 16px;font-size:12px;font-weight:500;border-radius:30px;}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-icon{background:transparent;border:none;color:var(--t3);padding:4px 6px;font-size:14px;line-height:1;border-radius:6px;}
.btn-icon:hover{color:var(--t2);background:var(--surface2)}
.btn-danger{background:var(--red-dim);border:1px solid rgba(240,112,112,0.2);color:var(--red);padding:7px 14px;font-size:12px;font-weight:500;border-radius:30px;}

/* ── INPUTS ── */
input,select{
  font-family:var(--font);
  background:rgba(255,255,255,0.055);
  border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);padding:11px 14px;font-size:14px;width:100%;
  outline:none;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus{
  border-color:var(--green);
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 0 3px var(--green-dim);
}
input::placeholder{color:var(--t3)}
select option{background:#0f1117;color:var(--text)}
label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
/* Prevent iOS Safari from zooming on input focus (requires font-size >= 16px on mobile) */
@media(max-width:767px){
  input,select{font-size:16px}
}

/* ── PILL / BADGE ── */
.pill{font-size:9px;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--t2);border:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px}
.badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,112,112,0.25)}
.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(29,201,154,0.25)}
.badge-amber{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,184,64,0.25)}

/* ── PAGE HEADER ── */
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem}
@media(min-width:768px){#profile-wrap{display:none}}
.page-title{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.page-sub{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}

/* ── HERO RING CARD ── */
.hero-card{
  background:var(--surface);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--r);
  padding:0.875rem 1rem;margin-bottom:8px;
}
.ring-wrap{position:relative;width:100px;height:100px;flex-shrink:0}
.ring-wrap svg{display:block;transform:rotate(-90deg)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.stat-label{font-size:11px;color:var(--t2);font-weight:500;display:flex;align-items:center;gap:5px}
.stat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.stat-val{font-size:12px;font-weight:600;font-family:var(--mono)}
@media(min-width:768px){
  .stat-row{padding:7px 0}
  .stat-label{font-size:14px;gap:7px}
  .stat-dot{width:8px;height:8px}
  .stat-val{font-size:15px}
}

/* ── SUMMARY GRID ── */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sum-item{
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 12px;
}
.sum-label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;font-weight:600}
.sum-val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-0.02em}

/* ── EXPENSE ROWS ── */
.exp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.exp-row:last-child{border-bottom:none}
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.exp-desc{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-meta{font-size:11px;color:var(--t2);margin-top:1px}

/* ── BILL CARDS ── */
.bill-card{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);border-radius:var(--r-sm);
  padding:11px 11px 11px 0;margin-bottom:8px;
  position:relative;overflow:hidden;
  transition:opacity 0.3s,background 0.2s;
}
.bill-card:hover{background:rgba(255,255,255,0.05)}
.bill-card.paid{opacity:0.42}
.b-accent{width:3px;position:absolute;left:0;top:0;bottom:0}
.b-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-left:12px}
.b-name{font-size:13px;font-weight:500}
.b-name.s{text-decoration:line-through;color:var(--t2)}
.b-meta{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:11px;color:var(--t2)}
.b-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.b-amt{font-size:14px;font-weight:600;font-family:var(--mono)}
.mark-btn{
  font-size:10px;padding:3px 10px;border-radius:20px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,0.13);
  color:var(--t2);font-family:var(--font);font-weight:500;
  transition:all 0.2s;
}
.mark-btn.paid-s{background:var(--green-dim);border-color:rgba(29,201,154,0.30);color:var(--green)}
.b-actions{display:flex;flex-direction:column;gap:4px;margin-right:3px}

/* ── NUMPAD ── */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.nk{
  height:74px;border-radius:16px;
  background:rgba(255,255,255,0.07);
  border:1px solid var(--border2);
  color:var(--text);font-size:26px;font-weight:500;font-family:var(--mono);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform 0.08s cubic-bezier(0.4,0,0.2,1),background 0.1s,box-shadow 0.12s;
  box-shadow:0 2px 0 rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.07);
  user-select:none;
}
.nk:hover{background:rgba(255,255,255,0.11);box-shadow:0 3px 8px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08)}
.nk:active{transform:translateY(2px) scale(0.95)!important;background:rgba(255,255,255,0.14);box-shadow:none}
.nk.bk{font-size:20px;background:rgba(255,255,255,0.04);border-color:var(--border)}
@media(min-width:768px){
  .numpad{gap:12px;margin:8px 0}
  .nk{height:82px;font-size:30px;border-radius:18px}
}

/* ── CATEGORY GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.cat-btn{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 4px;border-radius:12px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  cursor:pointer;font-size:10px;color:var(--t2);
  font-family:var(--font);font-weight:500;
  transition:all 0.15s;
}
.cat-btn.active{border-width:1.5px}
.cat-btn i{font-size:20px}
.cat-btn:active{transform:scale(0.88)!important}
@media(min-width:768px){
  .cat-grid{grid-template-columns:repeat(5,1fr)}
}

/* ── PROGRESS ── */
.prog{height:4px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width 0.65s cubic-bezier(0.4,0,0.2,1)}
.prog-track{height:6px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin:6px 0}
.prog-track-fill{height:100%;border-radius:4px;transition:width 0.65s cubic-bezier(0.4,0,0.2,1)}

/* ── BREAKDOWN ROWS ── */
.bkd-row{margin-bottom:13px}
.bkd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bkd-name{font-size:13px;display:flex;align-items:center;gap:7px;font-weight:500}
.bkd-right{display:flex;align-items:center;gap:8px}

/* ── SECTION LABEL ── */
.sec-lbl{display:flex;justify-content:space-between;align-items:center;padding:5px 0 8px}
.sec-lbl-l{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.12em}

/* ── INCOME ROW ── */
.inc-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.inc-row:last-child{border-bottom:none}

/* ── SUCCESS ANIMATION ── */
.ok-wrap{text-align:center;padding:4rem 0;animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
.ok-circle{
  width:72px;height:72px;border-radius:50%;
  background:var(--green-dim);border:2px solid rgba(29,201,154,0.30);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.ok-circle i{font-size:34px;color:var(--green)}

/* ── CONFIRM BOX ── */
.confirm-box{
  background:var(--amber-dim);
  border:1px solid rgba(240,184,64,0.22);border-radius:var(--r-sm);
  padding:14px;margin-bottom:10px;
}

/* ── INSIGHT CHIPS ── */
.insight-chip{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:var(--r-xs);
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  margin-bottom:6px;font-size:12px;font-weight:500;
}
.insight-chip i{font-size:15px;flex-shrink:0}

/* ── ARCHIVE ROW ── */
.arc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.arc-row:last-child{border-bottom:none}

/* ── GOAL CARDS ── */
.goal-card{
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px;margin-bottom:10px;
  position:relative;overflow:hidden;
}
.goal-card::before{

<script>
// ── CONSTANTS ──
const CATS=[
  {name:'Food',         icon:'ti-tools-kitchen-2', color:'#fbbf24',bg:'rgba(251,191,36,.14)'},
  {name:'Transport',    icon:'ti-car',              color:'#60a5fa',bg:'rgba(96,165,250,.14)'},
  {name:'Shopping',     icon:'ti-shopping-bag',     color:'#f472b6',bg:'rgba(244,114,182,.14)'},
  {name:'Entertainment',icon:'ti-device-gamepad-2', color:'#a78bfa',bg:'rgba(167,139,250,.14)'},
  {name:'Health',       icon:'ti-heart',            color:'#f87171',bg:'rgba(248,113,113,.14)'},
  {name:'Utilities',    icon:'ti-bolt',             color:'#34d399',bg:'rgba(52,211,153,.14)'},
  {name:'Housing',      icon:'ti-home',             color:'#94a3b8',bg:'rgba(148,163,184,.14)'},
  {name:'Education',    icon:'ti-book',             color:'#818cf8',bg:'rgba(129,140,248,.14)'},
  {name:'Savings',      icon:'ti-piggy-bank',       color:'#4ade80',bg:'rgba(74,222,128,.14)'},
  {name:'Other',        icon:'ti-dots',             color:'#6b7280',bg:'rgba(107,114,128,.14)'},
];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const NAV_TABS=[
  {id:'home',    icon:'ti-home-2',       label:'Home'},
  {id:'add',     fab:true},
  {id:'bills',   icon:'ti-repeat',       label:'Bills'},
  {id:'overview',icon:'ti-chart-bar-2',  label:'Overview'},
];
const SB_TABS=[
  {id:'home',    icon:'ti-home-2',       label:'Home'},
  {id:'add',     icon:'ti-circle-plus',  label:'Add expense'},
  {id:'bills',   icon:'ti-repeat',       label:'Fixed bills'},
  {id:'overview',icon:'ti-chart-bar-2',  label:'Overview'},
];

// ── HELPERS ──
const catOf   = n => CATS.find(c=>c.name===n)||CATS[CATS.length-1];
const sumAmt  = a => a.reduce((s,x)=>s+(x.amount||0),0);
const fmtAbs  = n => '$'+Math.abs(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt     = n => (n<0?'-':'')+'$'+Math.abs(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayStr= () => new Date().toISOString().split('T')[0];
const esc     = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const emptyMonth = () => {const d=new Date();return{month:d.getMonth(),year:d.getFullYear(),income:[],expenses:[],paidBills:[]}};
const isDesktop = () => window.innerWidth>=768;

// ── INPUT SANITIZATION ──
// Strip everything except printable letters, digits, spaces, and common punctuation (no control chars, no HTML chars)
const LIMITS={TEXT_NAME:40,TEXT_NOTE:60,TEXT_SOURCE:40,TEXT_GOAL:50,AMT_MAX:9999999.99,AMT_INT_DIGITS:7};
function sanitizeText(val,maxLen){
  // Allow letters (including accented), digits, spaces, and safe punctuation: . , - ' ( ) & #
  return String(val)
    .replace(/[^\p{L}\p{N} .,\-'()&#]/gu,'')
    .slice(0,maxLen||LIMITS.TEXT_NAME);
}
function sanitizeAmt(val){
  // Allow only digits and one dot
  let s=String(val).replace(/[^0-9.]/g,'');
  const parts=s.split('.');
  if(parts.length>2) s=parts[0]+'.'+parts.slice(1).join('');
  // Max 7 integer digits, 2 decimal digits
  if(s.includes('.')){
    let[int,dec]=s.split('.');
    int=int.slice(0,LIMITS.AMT_INT_DIGITS);
    dec=dec.slice(0,2);
    s=int+'.'+dec;
  } else {
    s=s.slice(0,LIMITS.AMT_INT_DIGITS);
  }
  return s;
}
// Prevent e, E, +, - from being typed in number inputs
function blockNumKeys(e){
  if(['e','E','+','-'].includes(e.key)) e.preventDefault();
}

// ── SUPABASE CLIENT ──
const _sb = (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL !== 'YOUR_SUPABASE_URL')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

// ── AUTH STATE ──
let currentUser = null;

// ── STORAGE (localStorage + Supabase sync) ──
const Store={
  get(k){try{const v=localStorage.getItem(k);return v?{value:v}:null}catch{return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch{}},

  async cget(k){
    if(_sb && currentUser){
      try{
        const{data,error}=await _sb.from('budget_store').select('value').eq('key',k).maybeSingle();
        if(!error&&data){
          Store.set(k,data.value);
          return{value:data.value};
        }
      }catch{}
    }
    return Store.get(k);
  },

  async cset(k,v){
    Store.set(k,v);
    if(_sb && currentUser){
      try{
        await _sb.from('budget_store')
          .upsert({user_id:currentUser.id,key:k,value:v},{onConflict:'user_id,key'});
      }catch{}
    }
  }
};

// ── APP STATE ──
const S={
  tab:'home',data:null,bills:[],archives:[],goals:[],
  amtStr:'0',selCat:'Food',addNote:'',justAdded:false,
  importRows:[],_importSkipped:0,
  showBillForm:false,editBillId:null,
  billForm:{name:'',category:'Housing',amount:'',dueDay:1},
  confirmArc:false,arcView:null,
  showInc:false,incForm:{source:'',amount:''},
  showGoalForm:false,editGoalId:null,
  goalForm:{name:'',target:'',saved:'',deadline:''},
};

// ── PERSISTENCE ──
async function saveData(){await Store.cset('budget:current',JSON.stringify(S.data))}
async function saveBills(){await Store.cset('budget:fixed_bills',JSON.stringify(S.bills))}
async function saveGoals(){await Store.cset('budget:goals',JSON.stringify(S.goals))}
async function load(){
  try{const r=await Store.cget('budget:current');    S.data=r?JSON.parse(r.value):emptyMonth()}catch{S.data=emptyMonth()}
  try{const r=await Store.cget('budget:fixed_bills');S.bills=r?JSON.parse(r.value):[]}catch{S.bills=[]}
  try{const r=await Store.cget('budget:archives_idx');S.archives=r?JSON.parse(r.value):[]}catch{S.archives=[]}
  try{const r=await Store.cget('budget:goals');      S.goals=r?JSON.parse(r.value):[]}catch{S.goals=[]}
}

// ── CALCULATIONS ──
function calc(){
  if(!S.data) S.data=emptyMonth();
  const d=S.data,b=S.bills,paidIds=d.paidBills||[];
  const totalInc=sumAmt(d.income);
  const totalVar=sumAmt(d.expenses);
  const totalFixed=sumAmt(b);
  const totalPaid=b.filter(x=>paidIds.includes(x.id)).reduce((s,x)=>s+x.amount,0);
  const totalUnpaid=totalFixed-totalPaid;
  const balance=totalInc-totalVar-totalUnpaid;
  const totalSpent=totalVar+totalPaid;
  const pct=totalInc>0?Math.min(1,(totalVar+totalUnpaid)/totalInc):0;
  const spentPct=totalInc>0?Math.min(1,totalVar/totalInc):0;
  const ringColor=balance<0?'#f07070':pct<0.75?'#1dc99a':pct<0.90?'#f0b840':'#f07070';
  const today=todayStr();
  const todayExps=d.expenses.filter(e=>e.date===today);
  const todayTotal=sumAmt(todayExps);
  const recentExps=[...d.expenses].sort((a,b)=>b.id-a.id);
  const byCat=CATS.map(c=>({...c,total:d.expenses.filter(e=>e.category===c.name).reduce((s,e)=>s+e.amount,0)}))
    .filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  const sorted=[...b].sort((a,b)=>a.dueDay-b.dueDay);
  const unpaid=sorted.filter(x=>!paidIds.includes(x.id));
  const paid_=sorted.filter(x=>paidIds.includes(x.id));
  const avgDailySpend=totalVar>0?(()=>{const now=new Date();return totalVar/now.getDate()})():0;
  const daysLeft=(()=>{const now=new Date();const last=new Date(now.getFullYear(),now.getMonth()+1,0);return last.getDate()-now.getDate()})();
  const projectedSpend=avgDailySpend*(new Date(S.data.year,S.data.month+1,0).getDate());
  return{totalInc,totalVar,totalFixed,totalPaid,totalUnpaid,balance,totalSpent,pct,spentPct,ringColor,
    today,todayExps,todayTotal,recentExps,byCat,unpaid,paid_,paidIds,paidCount:paid_.length,
    avgDailySpend,daysLeft,projectedSpend};
}

// ── GOAL ENGINE ──
function avgMonthlySavings(){
  // Build a list of net savings per closed month from archives
  const closed=S.archives.map(a=>{
    const inc=a.totalIncome||0;
    const spent=(a.totalExpenses||0)+(a.totalFixed||0);
    return inc-spent;
  });
  // Include current month if it has income data
  const c=calc();
  if(c.totalInc>0) closed.push(c.balance);
  if(closed.length===0) return 0;
  const sum=closed.reduce((a,b)=>a+b,0);
  return sum/closed.length;
}

function planGoal(goal){
  const saved=goal.saved||0;
  const remaining=Math.max(0,goal.target-saved);
  const pct=goal.target>0?Math.min(1,saved/goal.target):0;
  const avgSav=avgMonthlySavings();

  // Months needed at current savings rate
  let monthsNeeded=null,projDate=null;
  if(avgSav>0&&remaining>0){
    monthsNeeded=Math.ceil(remaining/avgSav);
    const now=new Date();
    const proj=new Date(now.getFullYear(),now.getMonth()+monthsNeeded,1);
    projDate=`${MONTHS[proj.getMonth()]} ${proj.getFullYear()}`;
  }

  // Deadline analysis — deadline stored as "YYYY-MM"
  let deadlineMonths=null,requiredPerMonth=null,onTrack=null,deadlineFmt=null;
  if(goal.deadline){
    const parts=goal.deadline.split('-');
    const dy=parseInt(parts[0],10);
    const dm=parseInt(parts[1],10); // 1–12
    if(!isNaN(dy)&&!isNaN(dm)){
      const now=new Date();
      const nowY=now.getFullYear();
      const nowM=now.getMonth()+1; // 1–12
      const diff=(dy-nowY)*12+(dm-nowM);
      deadlineMonths=Math.max(0,diff);
      requiredPerMonth=deadlineMonths>0?remaining/deadlineMonths:remaining;
      onTrack=avgSav>=requiredPerMonth;
      deadlineFmt=`${MONTHS[dm-1]} ${dy}`;
    }
  }

  return{saved,remaining,pct,avgSav,monthsNeeded,projDate,deadlineMonths,requiredPerMonth,onTrack};
}

function goalFormHtml(){
  const today=new Date();
  const curYear=today.getFullYear();
  const curMonth=today.getMonth()+1; // 1-12

  // Parse saved deadline
  const dlParts=S.goalForm.deadline?S.goalForm.deadline.split('-'):[];
  const dlYear=dlParts[0]?parseInt(dlParts[0],10):0;
  const dlMonth=dlParts[1]?parseInt(dlParts[1],10):0;

  // Year options: current year to +10
  const yearOpts=Array.from({length:11},(_,i)=>curYear+i)
    .map(y=>`<option value="${y}"${dlYear===y?' selected':''}>${y}</option>`).join('');

  // Month options — if selected year == current year, only future months
  const monthOpts=MONTHS.map((m,i)=>{
    const mNum=i+1;
    const disabled=(dlYear===curYear||!dlYear)&&mNum<=curMonth;
    return`<option value="${String(mNum).padStart(2,'0')}" ${disabled?'disabled':''} ${dlMonth===mNum?' selected':''}>${m}</option>`;
  }).join('');

  return`<div class="card">
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px">

function goalCardHtml(goal){
  const p=planGoal(goal);
  const barColor=p.pct>=1?'var(--green)':p.onTrack===false?'var(--red)':p.onTrack===true?'var(--green)':'var(--blue)';
  const pctW=Math.round(p.pct*100);

  // Status badge
  let badge='';
  if(p.pct>=1){
    badge=`<span class="badge badge-green" style="font-size:10px;padding:3px 8px">Achieved ✓</span>`;
  } else if(p.onTrack===true){
    badge=`<span class="badge badge-green" style="font-size:10px;padding:3px 8px">On track</span>`;
  } else if(p.onTrack===false){
    badge=`<span class="badge badge-red" style="font-size:10px;padding:3px 8px">Behind</span>`;
  }

  // Plan lines
  let planLines='';
  if(p.pct<1){
    if(p.avgSav>0){
      planLines+=`<div class="goal-stat-row"><span>Monthly savings avg</span><strong style="color:var(--green)">${fmtAbs(p.avgSav)}</strong></div>`;
      planLines+=`<div class="goal-stat-row"><span>Still needed</span><strong>${fmtAbs(p.remaining)}</strong></div>`;
    }
    if(goal.deadline&&p.deadlineMonths!==null){
      planLines+=`<div class="goal-stat-row"><span>Months to deadline</span><strong>${p.deadlineMonths}</strong></div>`;
      planLines+=`<div class="goal-stat-row"><span>Required / month</span><strong style="color:${p.onTrack?'var(--green)':'var(--red)'}">${fmtAbs(p.requiredPerMonth)}</strong></div>`;
      if(!p.onTrack&&p.avgSav>0){
        const gap=p.requiredPerMonth-p.avgSav;
        planLines+=`<div class="goal-stat-row"><span>Monthly shortfall</span><strong style="color:var(--red)">${fmtAbs(gap)}</strong></div>`;
      }
    } else if(p.monthsNeeded!==null){
      planLines+=`<div class="goal-stat-row"><span>Save / month needed</span><strong style="color:var(--blue)">${fmtAbs(p.remaining/p.monthsNeeded)}</strong></div>`;
      planLines+=`<div class="goal-stat-row"><span>Estimated completion</span><strong style="color:var(--blue)">${p.projDate}</strong></div>`;
    } else if(p.avgSav<=0){
      planLines+=`<div class="goal-stat-row"><span style="color:var(--amber)"><i class="ti ti-alert-triangle" style="font-size:11px"></i> Log income &amp; expenses to generate a plan</span></div>`;
    }
  }

  return`<div class="goal-card">
    <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:10px">
      <div class="goal-icon"><i class="ti ti-target"></i></div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px">
          <span style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(goal.name)}</span>
          ${badge}
        </div>
        <div style="font-size:12px;color:var(--t2);font-weight:500">
          ${fmtAbs(p.saved)} <span style="color:var(--t3)">of</span> ${fmtAbs(goal.target)}
          ${p.deadlineFmt?`<span style="color:var(--t3)"> · deadline ${p.deadlineFmt}</span>`:''}
        </div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button class="btn-icon edit-goal" data-id="${goal.id}" title="Edit"><i class="ti ti-edit" style="font-size:13px"></i></button>
        <button class="btn-icon del-goal" data-id="${goal.id}" title="Delete"><i class="ti ti-trash" style="font-size:13px"></i></button>
      </div>
    </div>
    <div class="prog-track" style="margin-bottom:5px">
      <div class="prog-track-fill" style="width:${pctW}%;background:${barColor}"></div>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:${planLines?'0':'4px'}">${pctW}% saved</div>
    ${planLines?`<div class="goal-plan">${planLines}</div>`:''}
  </div>`;
}

// ── INSIGHTS ──
function insightChips(c){
  const chips=[];
  if(c.avgDailySpend>0&&c.daysLeft>0){
    const proj=c.projectedSpend;
    if(c.totalInc>0&&proj>c.totalInc*0.9)
      chips.push({icon:'ti-alert-triangle',color:'var(--amber)',text:`Projected to spend ${fmtAbs(proj)} this month — ${Math.round(proj/c.totalInc*100)}% of income`});
    else if(c.avgDailySpend>0)
      chips.push({icon:'ti-trending-up',color:'var(--blue)',text:`Daily avg: ${fmtAbs(c.avgDailySpend)} · ${c.daysLeft} days left`});
  }
  if(c.totalFixed>0&&c.totalInc>0&&c.totalFixed/c.totalInc>0.5)
    chips.push({icon:'ti-alert-circle',color:'var(--red)',text:`Fixed bills are ${Math.round(c.totalFixed/c.totalInc*100)}% of income`});
  if(c.totalInc===0)
    chips.push({icon:'ti-info-circle',color:'var(--t2)',text:'Add income to see your budget balance'});
  return chips.length?`<div style="margin-bottom:10px">${chips.map(ch=>`
    <div class="insight-chip">
      <i class="ti ${ch.icon}" style="color:${ch.color}"></i>
      <span style="color:var(--t2)">${ch.text}</span>
    </div>`).join('')}</div>`:'';
}

      <button class="btn" id="arc-back"><i class="ti ti-arrow-left" style="margin-right:4px;font-size:11px"></i>Back</button>
      <span style="font-size:18px;font-weight:700">${esc(av.label)}</span>
    </div>
    <div class="sum-grid">
      ${[{l:'Income',v:aI,c:'#1dc99a'},{l:'Fixed bills',v:aF,c:'var(--red)'},{l:'Spending',v:aE,c:'var(--red)'},{l:'Balance',v:aB,c:aB>=0?'#1dc99a':'var(--red)'}]
        .map(x=>`<div class="sum-item"><div class="sum-label">${x.l}</div><div class="sum-val" style="color:${x.c}">${fmtAbs(x.v)}</div></div>`).join('')}
    </div>
    ${aCats.length>0?`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:14px">Spending breakdown</div>
    ${aCats.map(x=>`<div class="bkd-row"><div class="bkd-head">
      <span class="bkd-name"><i class="ti ${x.icon}" style="color:${x.color}"></i>${esc(x.name)}</span>
      <div class="bkd-right"><span style="font-size:11px;color:var(--t2)">${aE>0?Math.round((x.total/aE)*100):0}%</span>
      <span style="font-size:13px;font-weight:600;font-family:var(--mono)">${fmtAbs(x.total)}</span></div>
    </div><div class="prog-track"><div class="prog-track-fill" style="width:${aE>0?Math.min(100,(x.total/aE)*100):0}%;background:${x.color}"></div></div></div>`).join('')}</div>`:''
    }
    ${av.expenses.length>0?`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Expenses (${av.expenses.length})</div>
    ${[...av.expenses].sort((a,b)=>b.amount-a.amount).map(e=>expRow(e,false)).join('')}</div>`:''
    }`;
  }

  return`
  <div class="page-header">
    <div>
      <div class="page-title">${MONTHS[d.month]} ${d.year}</div>
      <div class="page-sub">Monthly overview</div>
    </div>
    <button class="btn" id="show-inc-ov"><i class="ti ti-plus" style="margin-right:3px;font-size:11px"></i>Income</button>
  </div>

  ${S.showInc&&S.tab==='overview'?incFormHtml(false):''}

  <div class="sum-grid">
    ${[{l:'Income',v:c.totalInc,col:'#1dc99a'},{l:'Fixed bills',v:c.totalFixed,col:'var(--red)'},{l:'Spending',v:c.totalVar,col:'var(--red)'},{l:'Balance',v:c.balance,col:c.balance>=0?'#1dc99a':'var(--red)'}]
      .map(x=>`<div class="sum-item"><div class="sum-label">${x.l}</div><div class="sum-val" style="color:${x.col}">${fmtAbs(x.v)}</div></div>`).join('')}
  </div>

  ${c.byCat.length>0?`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:14px">Spending breakdown</div>
  ${c.byCat.map(x=>`<div class="bkd-row"><div class="bkd-head">
    <span class="bkd-name"><i class="ti ${x.icon}" style="color:${x.color}"></i>${esc(x.name)}</span>
    <div class="bkd-right">
      <span style="font-size:11px;color:var(--t2)">${c.totalVar>0?Math.round((x.total/c.totalVar)*100):0}%</span>
      <span style="font-size:13px;font-weight:600;font-family:var(--mono)">${fmtAbs(x.total)}</span>
    </div>
  </div><div class="prog-track"><div class="prog-track-fill" style="width:${c.totalVar>0?Math.min(100,(x.total/c.totalVar)*100):0}%;background:${x.color}"></div></div></div>`).join('')}</div>`:''
  }

  ${d.income.length>0?`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Income sources</div>
  ${[...d.income].sort((a,b)=>b.id-a.id).map(i=>incRow(i)).join('')}</div>`:''
  }

  ${d.expenses.length>0?`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:8px">All expenses (${d.expenses.length})</div>
  ${c.recentExps.map(e=>expRow(e,true)).join('')}</div>`:''
  }

  ${S.archives.length>0?`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Past months</div>
  ${[...S.archives].reverse().map(a=>`<div class="arc-row">
    <div class="cat-icon" style="background:rgba(96,165,250,.12)"><i class="ti ti-calendar" style="color:#60a5fa;font-size:15px"></i></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:600">${esc(a.label)}</div>
      <div style="font-size:11px;color:var(--t2);margin-top:1px">
        In: ${fmtAbs(a.totalIncome||0)} &middot; Spent: ${fmtAbs((a.totalExpenses||0)+(a.totalFixed||0))}
      </div>
    </div>
    <button class="btn view-arc" data-key="${esc(a.key)}" style="font-size:11px;padding:5px 13px">View</button>
  </div>`).join('')}</div>`:''
  }

  <!-- ── SAVINGS GOALS ── -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0 8px;margin-top:4px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:14px;font-weight:700">Savings goals</span>
      ${S.goals.length>0?`<span class="badge" style="background:rgba(96,165,250,.13);color:var(--blue);border:1px solid rgba(96,165,250,.25)">${S.goals.length}</span>`:''}
    </div>
    <button class="btn" id="toggle-goal-form" style="font-size:11px">
      ${S.showGoalForm||S.editGoalId?'Cancel':'<i class="ti ti-plus" style="margin-right:3px;font-size:11px"></i>Add goal'}
    </button>
  </div>

  ${S.showGoalForm||S.editGoalId?goalFormHtml():''}

  ${S.goals.length===0&&!S.showGoalForm?`
  <div class="empty" style="padding:2rem 1rem">
    <i class="ti ti-target"></i>
    <div class="empty-title">No savings goals yet</div>
    <div class="empty-sub">Add a goal — vacation, car, emergency fund —<br>and get a personalized savings plan.</div>
  </div>`:S.goals.map(g=>goalCardHtml(g)).join('')
  }`;
}

// ── RENDER ──
let _renderedTab=null;
function render(){
  if(!S.data) return;
  const ct=document.getElementById('content');
  if(!ct){ console.error('render: #content missing'); return; }
  let html;
  try{
    html={home:renderHome,add:renderAdd,bills:renderBills,overview:renderOverview,import:renderImport}[S.tab]?.()??'';
  }catch(err){
    ct.innerHTML=`<div style="padding:2rem;color:#f07070;font-family:monospace;white-space:pre-wrap">Render error (tab=${S.tab}):\n${err}</div>`;
    console.error('render error',err);
    return;
  }
  ct.innerHTML=html;
  // Only animate when switching tabs, not on every numpad/state update
  if(S.tab!==_renderedTab){
    ct.classList.remove('anim');void ct.offsetHeight;ct.classList.add('anim');
    _renderedTab=S.tab;
  }

  // Mobile nav
  const nav=document.getElementById('nav');
  nav.innerHTML=NAV_TABS.map(x=>x.fab?`
    <button class="nav-fab-wrap${S.tab==='add'?' active':''}" data-tab="add">
      <div class="fab"><i class="ti ti-plus"></i></div>
      <span class="fab-lbl">Add</span>
    </button>`:`
    <button class="nav-item${S.tab===x.id?' active':''}" data-tab="${x.id}">
      <i class="ti ${x.icon}"></i><span>${x.label}</span>
    </button>`
  ).join('');

  // Desktop sidebar
  const sb=document.getElementById('sidebar');
  if(isDesktop()){
    sb.innerHTML=`
    <div class="sb-logo">
      Budget
    </div>
    <div class="sb-section">Navigation</div>
    ${SB_TABS.map(x=>`
    <button class="sb-nav-item${S.tab===x.id?' active':''}" data-tab="${x.id}">
      <i class="ti ${x.icon}"></i>${x.label}
    </button>`).join('')}
    <div class="sb-divider"></div>
    <div class="sb-section">Month</div>
    <div style="padding:0 1.25rem">
      <div style="font-size:13px;font-weight:600;margin-bottom:2px">${MONTHS[S.data?S.data.month:new Date().getMonth()]}</div>
      <div style="font-size:11px;color:var(--t2)">${S.data?S.data.year:new Date().getFullYear()}</div>
    </div>
    <div style="margin-top:auto;padding:0.75rem 0.5rem 0">
      <div class="sb-divider"></div>
      ${currentUser?`<div style="padding:6px 1.25rem 4px;font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(currentUser.email)}</div>`:''}
      <button class="sb-nav-item" id="sb-notif" title="Bill reminders">
        <i class="ti ti-bell" id="sb-bell-icon"></i><span id="sb-notif-label">Reminders</span>
      </button>
      <button class="sb-nav-item" id="sb-logout" style="color:var(--red)">
        <i class="ti ti-logout" style="color:var(--red)"></i>Sign out
      </button>
    </div>`;
  } else {
    sb.innerHTML='';
  }

  bind();
}

// ── EVENT BINDING ──
function bind(){
  const $=id=>document.getElementById(id);
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));

  // Tab switching
  on('[data-tab]','click',e=>{
    const prev=S.tab;
    S.tab=e.currentTarget.dataset.tab;
    if(S.tab!=='add') S.amtStr='0';
    if(S.tab!==prev){S.showInc=false;S.confirmArc=false;}
    render();
  });

  // Home actions
  if($('end-month'))    $('end-month').addEventListener('click',()=>{S.confirmArc=true;render()});
  if($('do-arc'))       $('do-arc').addEventListener('click',arcMonth);
  if($('no-arc'))       $('no-arc').addEventListener('click',()=>{S.confirmArc=false;render()});
  if($('snap-bills'))   $('snap-bills').addEventListener('click',()=>{S.tab='bills';render()});
  if($('log-inc-home')) $('log-inc-home').addEventListener('click',()=>{S.showInc=true;render()});
  if($('show-inc-ov'))  $('show-inc-ov').addEventListener('click',()=>{S.showInc=!S.showInc;render()});
  if($('arc-back'))     $('arc-back').addEventListener('click',()=>{S.arcView=null;render()});

  // Income form
  if($('inc-src'))   $('inc-src').addEventListener('input',e=>S.incForm.source=e.target.value);
  if($('inc-amt'))   $('inc-amt').addEventListener('input',e=>S.incForm.amount=e.target.value);
  if($('save-inc'))  $('save-inc').addEventListener('click',()=>{
    const src=sanitizeText(S.incForm.source,LIMITS.TEXT_SOURCE).trim();
    const amt=parseFloat(sanitizeAmt(S.incForm.amount));
    if(!src||!amt||amt<=0||amt>LIMITS.AMT_MAX) return;
    S.data.income.push({id:Date.now(),date:todayStr(),source:src,amount:amt});
    S.incForm={source:'',amount:''};S.showInc=false;
    saveData();render();
  });
  if($('cancel-inc')) $('cancel-inc').addEventListener('click',()=>{S.showInc=false;render()});

  // Delete expense / income
  on('.del-exp','click',e=>{
    const id=+e.currentTarget.dataset.id;
    S.data.expenses=S.data.expenses.filter(x=>x.id!==id);
    saveData();render();
  });
  on('.del-inc','click',e=>{
    const id=+e.currentTarget.dataset.id;
    S.data.income=S.data.income.filter(x=>x.id!==id);
    saveData();render();
  });

  // CSV Import
  if($('open-import')){ $('open-import').addEventListener('click',()=>{ S.tab='import';S.importRows=[];render(); }); }
  if($('import-back')){ $('import-back').addEventListener('click',()=>{ S.tab='add';render(); }); }
  if($('csv-file-input')){
    $('csv-file-input').addEventListener('change',e=>{
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const all=parseCSV(ev.target.result);
        // Only keep transactions from the current open month
        const m=S.data.month,y=S.data.year;
        S.importRows=all.filter(r=>{
          const d=new Date(r.date+'T00:00:00');
          return d.getFullYear()===y && d.getMonth()===m;
        });
        S._importSkipped=all.length-S.importRows.length;
        render();
      };
      reader.readAsText(file);
    });
  }
  function updateImportBar(){
    const btn=$('do-import'); if(!btn) return;
    const count=S.importRows.filter(r=>!r.skip).length;
    const total=S.importRows.filter(r=>!r.skip).reduce((s,r)=>s+r.amount,0);
    btn.textContent=`Import ${count} expense${count!==1?'s':''} · ${fmt(total)}`;
  }
  on('.imp-chk','change',e=>{
    const i=+e.currentTarget.dataset.i;
    S.importRows[i].skip=!e.currentTarget.checked;
    const row=e.currentTarget.closest('[data-row]');
    if(row) row.style.opacity=S.importRows[i].skip?'0.4':'1';
    updateImportBar();
  });
  on('.imp-cat','change',e=>{ const i=+e.currentTarget.dataset.i; S.importRows[i].category=e.currentTarget.value; });
  if($('do-import')){
    $('do-import').addEventListener('click',async()=>{
      const toAdd=S.importRows.filter(r=>!r.skip);
      toAdd.forEach(r=>{
        if(r.billMatch){
          // Mark the bill as paid
          if(!S.data.paidBills.includes(r.billMatch.id)){
            S.data.paidBills.push(r.billMatch.id);
          }
        } else {
          // Add as regular expense
          S.data.expenses.push({id:Date.now()+Math.random(),date:r.date,amount:r.amount,category:r.category,note:r.desc.slice(0,60)});
        }
      });
      S.tab='home';S.importRows=[];
      await saveData(); render();
    });
  }

  // Numpad
  on('.nk-btn','click',e=>{
    const k=e.currentTarget.dataset.k;
    if(k==='⌫'){
      S.amtStr=S.amtStr.length>1?S.amtStr.slice(0,-1):'0';
    } else if(k==='.'){
      if(!S.amtStr.includes('.')) S.amtStr+='.';
    } else if(S.amtStr==='0'){
      S.amtStr=k;
    } else if(S.amtStr.includes('.')){
      // max 2 decimal digits
      if(S.amtStr.split('.')[1].length<2) S.amtStr+=k;
    } else {
      // max 7 integer digits
      if(S.amtStr.length<LIMITS.AMT_INT_DIGITS) S.amtStr+=k;
    }
    render();
  });

  // Category pick
  on('.cat-pick','click',e=>{S.selCat=e.currentTarget.dataset.cat;render()});

  // Note field — sanitize text, strip control chars
  const note=$('add-note');
  if(note){
    note.addEventListener('keydown',e=>{if(e.key.length===1&&!/[\p{L}\p{N} .,\-'()&#]/u.test(e.key))e.preventDefault()});
    note.addEventListener('input',e=>{
      const clean=sanitizeText(e.target.value,LIMITS.TEXT_NOTE);
      S.addNote=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }

  // Add expense
  if($('do-add')) $('do-add').addEventListener('click',()=>{
    const amt=parseFloat(S.amtStr);
    if(!amt||isNaN(amt)||amt<=0||amt>LIMITS.AMT_MAX) return;
    S.data.expenses.push({
      id:Date.now(),date:todayStr(),
      category:S.selCat,
      description:S.addNote.trim()||S.selCat,
      amount:amt
    });
    S.amtStr='0';S.addNote='';S.justAdded=true;
    saveData();render();
    setTimeout(()=>{S.justAdded=false;S.tab='home';render()},1000);
  });

  // Income form — sanitize + block bad keys
  if($('inc-src')){
    $('inc-src').addEventListener('keydown',e=>{if(e.key.length===1&&!/[\p{L}\p{N} .,\-'()&#]/u.test(e.key))e.preventDefault()});
    $('inc-src').addEventListener('input',e=>{
      const clean=sanitizeText(e.target.value,LIMITS.TEXT_SOURCE);
      S.incForm.source=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }
  if($('inc-amt')){
    $('inc-amt').addEventListener('keydown',blockNumKeys);
    $('inc-amt').addEventListener('input',e=>{
      const clean=sanitizeAmt(e.target.value);
      S.incForm.amount=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }

  // Bills
  if($('toggle-bill-form')) $('toggle-bill-form').addEventListener('click',()=>{
    S.showBillForm=!S.showBillForm;
    if(!S.showBillForm){S.editBillId=null;S.billForm={name:'',category:'Housing',amount:'',dueDay:1}}
    render();
  });
  if($('cancel-bill')) $('cancel-bill').addEventListener('click',()=>{
    S.showBillForm=false;S.editBillId=null;
    S.billForm={name:'',category:'Housing',amount:'',dueDay:1};
    render();
  });
  if($('b-name')){
    $('b-name').addEventListener('keydown',e=>{if(e.key.length===1&&!/[\p{L}\p{N} .,\-'()&#]/u.test(e.key))e.preventDefault()});
    $('b-name').addEventListener('input',e=>{
      const clean=sanitizeText(e.target.value,LIMITS.TEXT_NAME);
      S.billForm.name=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }
  if($('b-cat'))   $('b-cat').addEventListener('change',e=>S.billForm.category=e.target.value);
  if($('b-day'))   $('b-day').addEventListener('change',e=>S.billForm.dueDay=+e.target.value);
  if($('b-amt')){
    $('b-amt').addEventListener('keydown',blockNumKeys);
    $('b-amt').addEventListener('input',e=>{
      const clean=sanitizeAmt(e.target.value);
      S.billForm.amount=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }
  if($('save-bill')) $('save-bill').addEventListener('click',()=>{
    const name=S.billForm.name.trim(),amt=parseFloat(S.billForm.amount);
    if(!name||!amt||amt<=0||amt>LIMITS.AMT_MAX) return;
    const b={name,category:S.billForm.category,amount:amt,dueDay:parseInt(S.billForm.dueDay)};
    if(S.editBillId){
      S.bills=S.bills.map(x=>x.id===S.editBillId?{...b,id:S.editBillId}:x);
      S.editBillId=null;
    } else {
      S.bills.push({...b,id:Date.now()});
    }
    S.billForm={name:'',category:'Housing',amount:'',dueDay:1};
    S.showBillForm=false;saveBills();render();
  });

  on('.toggle-paid','click',e=>{
    const id=+e.currentTarget.dataset.id,paid=S.data.paidBills||[];
    S.data.paidBills=paid.includes(id)?paid.filter(x=>x!==id):[...paid,id];
    saveData();render();
  });
  on('.edit-bill','click',e=>{
    const id=+e.currentTarget.dataset.id,b=S.bills.find(x=>x.id===id);
    if(!b) return;
    S.editBillId=id;
    S.billForm={name:b.name,category:b.category,amount:String(b.amount),dueDay:b.dueDay};
    S.showBillForm=true;render();
  });
  on('.del-bill','click',e=>{
    const id=+e.currentTarget.dataset.id;
    S.bills=S.bills.filter(x=>x.id!==id);
    S.data.paidBills=(S.data.paidBills||[]).filter(x=>x!==id);
    saveBills();saveData();render();
  });

  on('.view-arc','click',async e=>{
    try{
      const r=await Store.cget(e.currentTarget.dataset.key);
      if(r) S.arcView=JSON.parse(r.value);
      render();
    }catch{}
  });

  // ── GOALS ──
  if($('toggle-goal-form')) $('toggle-goal-form').addEventListener('click',()=>{
    S.showGoalForm=!S.showGoalForm;
    if(!S.showGoalForm){S.editGoalId=null;S.goalForm={name:'',target:'',saved:'',deadline:''}}
    render();
  });
  if($('cancel-goal')) $('cancel-goal').addEventListener('click',()=>{
    S.showGoalForm=false;S.editGoalId=null;
    S.goalForm={name:'',target:'',saved:'',deadline:''};
    render();
  });
  if($('g-name')){
    $('g-name').addEventListener('keydown',e=>{if(e.key.length===1&&!/[\p{L}\p{N} .,\-'()&#]/u.test(e.key))e.preventDefault()});
    $('g-name').addEventListener('input',e=>{
      const clean=sanitizeText(e.target.value,LIMITS.TEXT_GOAL);
      S.goalForm.name=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }
  if($('g-target')){
    $('g-target').addEventListener('keydown',blockNumKeys);
    $('g-target').addEventListener('input',e=>{
      const clean=sanitizeAmt(e.target.value);
      S.goalForm.target=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }
  if($('g-saved')){
    $('g-saved').addEventListener('keydown',blockNumKeys);
    $('g-saved').addEventListener('input',e=>{
      const clean=sanitizeAmt(e.target.value);
      S.goalForm.saved=clean;
      if(e.target.value!==clean) e.target.value=clean;
    });
  }
  function syncDeadline(){
    const m=$('g-dl-month')?.value||'';
    const y=$('g-dl-year')?.value||'';
    S.goalForm.deadline=(y&&m)?`${y}-${m}`:'';
  }
  if($('g-dl-month')) $('g-dl-month').addEventListener('change',syncDeadline);
  if($('g-dl-year'))  $('g-dl-year').addEventListener('change',syncDeadline);
  if($('save-goal')) $('save-goal').addEventListener('click',()=>{
    const name=sanitizeText(S.goalForm.name,LIMITS.TEXT_GOAL).trim();
    const target=parseFloat(sanitizeAmt(S.goalForm.target));
    const saved=parseFloat(sanitizeAmt(S.goalForm.saved))||0;
    if(!name||!target||target<=0||target>LIMITS.AMT_MAX) return;
    if(saved<0||saved>target) return;
    const g={name,target,saved,deadline:S.goalForm.deadline||''};
    if(S.editGoalId){
      S.goals=S.goals.map(x=>x.id===S.editGoalId?{...g,id:S.editGoalId}:x);
      S.editGoalId=null;
    } else {
      S.goals.push({...g,id:Date.now()});
    }
    S.goalForm={name:'',target:'',saved:'',deadline:''};
    S.showGoalForm=false;
    saveGoals();render();
  });
  on('.edit-goal','click',e=>{
    const id=+e.currentTarget.dataset.id;
    const g=S.goals.find(x=>x.id===id);
    if(!g) return;
    S.editGoalId=id;
    S.goalForm={name:g.name,target:String(g.target),saved:String(g.saved||0),deadline:g.deadline||''};
    S.showGoalForm=true;render();
  });
  on('.del-goal','click',e=>{

async function arcMonth(){
  const d=S.data,c=calc();
  const key=`budget:archive:${d.year}-${String(d.month+1).padStart(2,'0')}`;
  const label=`${MONTHS[d.month]} ${d.year}`;
  // Save full archive of the current month
  await Store.cset(key,JSON.stringify({...d,label,fixedBillsSnapshot:S.bills}));
  const newIdx=[...S.archives.filter(a=>a.key!==key),
    {key,label,totalIncome:c.totalInc,totalExpenses:c.totalVar,totalFixed:c.totalFixed}];
  S.archives=newIdx;
  await Store.cset('budget:archives_idx',JSON.stringify(newIdx));
  // Advance to next month (not new Date() which could stay in same month)
  const nextMonth=d.month===11?0:d.month+1;
  const nextYear=d.month===11?d.year+1:d.year;
  S.data={month:nextMonth,year:nextYear,income:[],expenses:[],paidBills:[]};
  S.confirmArc=false;
  await saveData();
  render();
}

// Extra known provider aliases for bill matching
const BILL_ALIASES={
  internet:['comcast','xfinity','spectrum','optimum','cox','fios','att internet','internet'],
  phone:['t-mobile','tmobile','metro by t','metro pcs','verizon wireless','at&t wireless','sprint','boost','cricket'],

function matchBill(desc, bills){
  if(!bills||!bills.length) return null;
  const d=desc.toLowerCase().replace(/[^a-z0-9 ]/g,' ');

  for(const bill of bills){
    const bn=bill.name.toLowerCase().replace(/[^a-z0-9 ]/g,' ');
    // Direct: any word of bill name (>2 chars) in description
    const words=bn.split(/\s+/).filter(w=>w.length>2);
    if(words.some(w=>d.includes(w))) return bill;
    // Alias: check known provider aliases keyed by bill name words
    for(const[key,aliases]of Object.entries(BILL_ALIASES)){
      if(words.some(w=>key.includes(w)||w.includes(key))){
        if(aliases.some(a=>d.includes(a))) return bill;
      }
    }
  }
  return null;
}

function autoCategory(desc){
  const d=desc.toLowerCase();
  for(const[cat,kws]of Object.entries(IMPORT_KW)){
    if(kws.some(k=>d.includes(k))) return cat;
  }
  return 'Other';
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return[];

  const parseRow=l=>{
    const cols=[];let cur='',inQ=false;
    for(const c of l){
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){cols.push(cur.trim().replace(/^"|"$/g,''));cur='';}
      else cur+=c;
    }
    cols.push(cur.trim().replace(/^"|"$/g,''));
    return cols;
  };

  // Scan up to first 20 lines to find the real header row
  // (BofA adds a summary block before the actual data)
  let headerIdx=-1;
  for(let i=0;i<Math.min(lines.length,20);i++){
    const cols=parseRow(lines[i]).map(h=>h.toLowerCase());
    if(cols.some(h=>h.includes('date'))&&cols.some(h=>h.includes('amount'))){
      headerIdx=i; break;
    }
  }
  if(headerIdx<0) return[];

  const headers=parseRow(lines[headerIdx]).map(h=>h.toLowerCase().replace(/[^a-z ]/g,'').trim());
  // Detect columns
  const di=headers.findIndex(h=>h.includes('date'));
  const descCols=['description','payee','memo','narrative','transaction'];
  const ai=headers.findIndex(h=>['amount','debit'].some(k=>h.includes(k)));
  const desi=headers.findIndex(h=>descCols.some(k=>h.includes(k)));
  if(di<0||ai<0||desi<0) return[];

  const rows=[];
  for(let i=headerIdx+1;i<lines.length;i++){
    const cols=parseRow(lines[i]);
    if(cols.length<Math.max(di,ai,desi)+1) continue;
    const rawAmt=cols[ai].replace(/[$, ]/g,'').replace('−','-');
    const amt=parseFloat(rawAmt);
    if(isNaN(amt)||amt>=0) continue; // skip credits/income
    const desc=cols[desi].replace(/\*/g,' ').replace(/\s+/g,' ').trim();
    if(!desc) continue;

    // Parse posting date (MM/DD/YYYY or YYYY-MM-DD)
    let postingRaw=cols[di].trim();
    const m1=postingRaw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    const m2=postingRaw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    let postingDate=postingRaw;
    let postingYear=new Date().getFullYear();
    if(m1){ postingDate=`${m1[3]}-${m1[1]}-${m1[2]}`; postingYear=+m1[3]; }
    else if(m2){ postingYear=+m2[1]; }

    // BofA embeds the real purchase date as MM/DD in the description
    // e.g. "PAYPAL *UBER 04/30 PURCHASE..." → actual date is Apr 30
    let date=postingDate;
    const descDate=desc.match(/\b(\d{2})\/(\d{2})\b/);
    if(descDate){
      date=`${postingYear}-${descDate[1]}-${descDate[2]}`;
      // If the extracted month is Dec and posting is Jan, use previous year
      if(+descDate[1]===12 && new Date(postingDate).getMonth()===0){
        date=`${postingYear-1}-${descDate[1]}-${descDate[2]}`;
      }
    }

    const billMatch=matchBill(desc,S.bills);
    rows.push({id:Date.now()+i,date,desc,amount:Math.abs(amt),category:autoCategory(desc),skip:false,billMatch:billMatch||null});
  }
  return rows;
}

let _realtimeSub=null;

function startRealtime(){
  if(_realtimeSub) return;
  _realtimeSub=_sb.channel('budget-sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'budget_store'},()=>{
      load().then(render);
    }).subscribe();
}

async function launchApp(user){
  currentUser=user;
  if(!document.getElementById('content')) restoreShell();
  try{ await load(); }catch(e){ console.error('load failed',e); }
  try{ render(); }catch(e){
    const ct=document.getElementById('content');
    if(ct) ct.innerHTML=`<div style="padding:2rem;color:#f07070;font-family:monospace;white-space:pre-wrap">Boot error:\n${e}</div>`;
    console.error('render failed',e);
    return;
  }
  startRealtime();
}

async function boot(){
  if(!_sb){ await load(); render(); return; }

  // Always show login immediately — no blank spinner risk
  renderLogin();

  // Then silently check for an existing session (reads localStorage, no network needed)
  try{
    const{data:{session},error}=await _sb.auth.getSession();
    if(error) console.error('getSession error',error);
    if(session?.user) await launchApp(session.user);
  }catch(e){ console.error('boot getSession threw',e); }

  // Handle future sign-in / sign-out events
  _sb.auth.onAuthStateChange(async(event,session)=>{
    if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED')&&session?.user&&!currentUser){
      await launchApp(session.user);
    } else if(event==='SIGNED_OUT'){
      currentUser=null;
      _realtimeSub=null;
      renderLogin();
    }
  });
}

boot();

// ── PUSH NOTIFICATIONS ──
const VAPID_PUBLIC = 'BEPVdgmhXk5usxJFiyGuoDyFIP6R0t8B_X2AklSlES2TWkd3MTUS0etR0Iw8DozuFNtPjNQrhuYL3XThwfN-Mv8';

function urlBase64ToUint8Array(b64){
  const pad=b64+'='.repeat((4-b64.length%4)%4);
  const raw=atob(pad.replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function getNotifStatus(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)) return 'unsupported';
  const perm=Notification.permission;
  if(perm==='denied') return 'denied';
  if(perm==='granted'){
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    return sub?'subscribed':'granted';
  }
  return 'default';
}

async function updateNotifButton(){
  const btn=document.getElementById('sb-notif');
  const icon=document.getElementById('sb-bell-icon');
  const label=document.getElementById('sb-notif-label');
  if(!btn) return;
  const status=await getNotifStatus();
  if(status==='subscribed'){
    icon.className='ti ti-bell-check';
    icon.style.color='var(--green)';
    label.textContent='Reminders on';
  } else if(status==='denied'){
    icon.className='ti ti-bell-off';
    icon.style.color='var(--t3)';
    label.textContent='Blocked';
    btn.style.opacity='0.5';
    btn.disabled=true;
  } else if(status==='unsupported'){
    btn.style.display='none';
  } else {
    icon.className='ti ti-bell';
    icon.style.color='';
    label.textContent='Reminders';
  }
}

async function updateMenuNotifButton(){
  const icon=document.getElementById('menu-bell-icon');
  const label=document.getElementById('menu-notif-label');
  if(!icon) return;
  const status=await getNotifStatus();
  if(status==='subscribed'){
    icon.className='ti ti-bell-check'; icon.style.color='var(--green)';
    label.textContent='Reminders on';
  } else if(status==='denied'){
    icon.className='ti ti-bell-off'; icon.style.color='var(--t3)';
    label.textContent='Blocked';
  } else {
    icon.className='ti ti-bell'; icon.style.color='';
    label.textContent='Reminders';
  }
}

async function enableNotifications(){
  if(!currentUser) return;
  const reg=await navigator.serviceWorker.ready;
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ updateNotifButton(); return; }
  const sub=await reg.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)
  });
  await fetch('/api/subscribe',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subscription:sub.toJSON(),user_id:currentUser.id})
  });
  updateNotifButton();
}

document.addEventListener('click',e=>{
  if(e.target.closest('#sb-notif')) enableNotifications();
});

// ── SERVICE WORKER + AUTO-UPDATE ──
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    const reg = await navigator.serviceWorker.register('/sw.js').catch(()=>null);
    if(!reg) return;

    // Show update banner whenever a new SW is waiting
    function checkForWaiting(r){
      if(r.waiting){
        showUpdateBanner(r.waiting);
      }
    }

    // New SW installed while page is open
    reg.addEventListener('updatefound',()=>{
      const newSW = reg.installing;
      newSW.addEventListener('statechange',()=>{
        if(newSW.state==='installed' && navigator.serviceWorker.controller){
          showUpdateBanner(newSW);
        }
      });
    });

    // SW was already waiting when page opened
    checkForWaiting(reg);

    // Reload when SW takes control (after skipWaiting)
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!refreshing){ refreshing=true; window.location.reload(); }
    });
  });
}

function showUpdateBanner(sw){
  if(document.getElementById('update-banner')) return;
  const b=document.createElement('div');
  b.id='update-banner';
  b.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;background:#1dc99a;color:#001710;padding:11px 20px;border-radius:50px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(29,201,154,0.5);display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--font)';
  b.innerHTML='<i class="ti ti-refresh" style="font-size:16px"></i>New version — tap to update';
  b.addEventListener('click',()=>{ sw.postMessage({type:'SKIP_WAITING'}); });
  document.body.appendChild(b);
}
